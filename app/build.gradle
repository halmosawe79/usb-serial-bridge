plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usbserial.bridge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.usbserial.bridge'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // usb-serial-for-android (supports CDC/ACM, FTDI, CP210x, CH340/CH341, PL2303, etc.)
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'

    // Force consistent Kotlin stdlib versions to avoid duplicate class conflicts
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}
